name: Complete Repository & File Checker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check-all-files:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب جميع ملفات المستودع
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ينصح به لفحص التاريخ والملفات بالكامل

      # 2. فحص شامل وعام لجميع أنواع الملفات داخل المشروع
      - name: Super-Linter (Check ALL files in repo)
        uses: super-linter/super-linter/slim@v5
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. فحص سريع للتأكد من عدم وجود ملفات معطوبة أو ترميز غير صالح (UTF-8)
      - name: Validate file integrity & encoding for all files
        run: |
          echo "Checking syntax and formatting for all repo files..."
          find . -type f -not -path '*/.*' -not -path '*/build/*' -exec file --mime {} +

