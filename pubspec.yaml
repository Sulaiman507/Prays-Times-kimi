name: prayer_times_app
description: تطبيق مواقيت صلاة يعمل بدون إنترنت

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Offline Prayer Calculation Library
  adhan: ^2.0.0

  # Local Storage
  shared_preferences: ^2.5.5

  # Date & Time formatting
  intl: ^0.18.1

  # Beautiful Fonts
  google_fonts: ^6.1.0

  # Notifications & Timezone
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
