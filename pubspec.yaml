name: prayer_times_app
description: تطبيق مواقيت صلاة يعمل بدون إنترنت

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Offline Prayer Calculation Library
  adhan: ^2.0.0

  # Local Storage
  shared_preferences: ^2.5.5

  # Date & Time formatting
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # خطوط مضمّنة محلياً لتطبيق يعمل بالكامل بدون إنترنت
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
